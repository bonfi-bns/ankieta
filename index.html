<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Hello World</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .box {

      text-align: center;

</head>
<body>
  <div class="box">
    <h1>Hello world 👋</h1>
    <p>GitHub Pages działa poprawnie ✅</p>
  </div>
</body>
</html>
